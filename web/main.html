<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" /><meta name="theme-color" content="#f5f5f5" /><title>flymrp · 模拟器</title><link rel="stylesheet" href="./main.css" /></head>
<body>
  <header class="player-bar" aria-label="模拟器控制栏">
    <button id="back" class="icon-button" aria-label="返回游戏库" title="返回游戏库">‹</button><strong id="game-title">MRP</strong><span id="fps">— FPS</span>
    <select id="speed" aria-label="运行倍速" title="运行倍速"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select>
    <button id="rotate-left" class="icon-button" aria-label="向左旋转" title="向左旋转">↶</button><button id="rotate-right" class="icon-button" aria-label="向右旋转" title="向右旋转">↷</button>
    <button id="mute" class="icon-button" aria-label="静音" title="声音" aria-pressed="false">♪</button><button id="toggle-keypad" class="icon-button" aria-label="隐藏虚拟键盘" title="虚拟键盘" aria-pressed="true">▦</button><button id="fullscreen" class="icon-button" aria-label="全屏" title="全屏">⛶</button><button id="library-toggle" class="icon-button" aria-label="模拟器设置" title="设置" aria-controls="game-drawer" aria-expanded="false">⚙</button>
  </header>
  <main class="stage" id="stage"><div id="screen-viewport"><div class="screen-shell" id="screen-shell"><canvas id="screen" width="240" height="320" tabindex="0" aria-label="游戏画面"></canvas><div class="empty-screen" id="empty-screen"><strong>准备好，开始游戏</strong><span>从游戏库选择，或打开本地 MRP 文件。</span><label class="upload" for="file">打开 MRP 文件<input id="file" type="file" accept=".mrp,.MRP,application/octet-stream" /></label></div></div></div></main>
  <div id="status" class="status" role="status">选择一个 MRP 开始</div>
  <footer class="controller" id="keypad" aria-label="虚拟键盘">
    <div class="joypad"><button data-key="SOFTLEFT">左软键</button><button data-key="UP" aria-label="上">▲</button><button data-key="SOFTRIGHT">右软键</button><button data-key="LEFT" aria-label="左">◀</button><button data-key="FIRE" class="confirm">OK</button><button data-key="RIGHT" aria-label="右">▶</button><span></span><button data-key="DOWN" aria-label="下">▼</button><button id="stop" class="danger" disabled>挂断</button></div>
    <div class="numbers"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="STAR">*</button><button data-key="0">0</button><button data-key="POUND">#</button></div>
  </footer>
  <aside id="game-drawer" class="settings-panel" aria-label="模拟器设置" hidden>
    <div class="settings-heading"><h1>模拟器设置</h1><button id="close-settings" aria-label="关闭设置">×</button></div>
    <div class="transport"><button id="pause" disabled>暂停</button><button id="restart" disabled>重启</button><button id="screenshot">截图</button></div>
    <label class="setting">音量 <input id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="音量" /><output id="volume-value">70%</output></label>
    <label class="setting">MIDI 播放器 <select id="midi-player"><option value="tinysynth">TinySynth · GM（推荐）</option><option value="simple">轻量方波</option></select></label>
    <label class="setting">画面缩放 <select id="zoom"><option value="auto">适应窗口</option><option value="1">1× 原始大小</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select></label>
    <label class="setting">画面方向 <select id="rotation"><option value="0">竖屏 · 0°</option><option value="1">向右 · 90°</option><option value="2">倒置 · 180°</option><option value="3">向左 · 270°</option></select></label>
    <label class="setting">显示 FPS <input id="show-fps" type="checkbox" checked /></label>
    <label class="setting">键盘位置 <select id="keypad-side"><option value="normal">方向键在左</option><option value="reverse">方向键在右</option></select></label>
    <label class="setting">屏幕分辨率 <select id="resolution"><option value="auto">自动识别</option><option>176x220</option><option>240x320</option><option>240x400</option><option>320x240</option><option>320x480</option><option>480x320</option></select></label>
    <p class="hint">分辨率在下次加载时生效；缩放会限制在窗口范围内。加速效果取决于设备性能。</p>
    <button id="theme">切换深浅主题</button>
    <details><summary>键盘与操作说明</summary><p>方向键 / WASD 移动，Enter / 空格 / J 确认，Q / E 为左右软键。数字键对应手机键盘，部分游戏使用 5 确认。旋转后方向键与画面方向一致。</p><p>FPS 表示游戏实际提交画面的频率，静止画面可能显示 0。游戏兼容性仍在完善。</p></details>
  </aside>
  <dialog id="guest-editor" aria-labelledby="guest-editor-title"><form id="guest-editor-form"><h2 id="guest-editor-title">游戏输入</h2><label for="guest-editor-text">内容</label><input id="guest-editor-text" autocomplete="off" /><div><button type="submit">确定</button><button type="button" id="guest-editor-cancel">取消</button></div></form></dialog>
  <script type="module" src="./app.ts"></script>
</body>
</html>
